services:

  postgres:
    image: postgres:17
    container_name: postgres
    restart: always

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fire_detection

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
     image: dpage/pgadmin4
     restart: always
     environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
     ports:
      - "5050:80"
     depends_on:
        - postgres

  backend:
    build: ./backend

    ports:
      - "8080:8080"

    depends_on:
      - postgres

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: admin
      DB_PASSWORD: password
      DB_NAME: fire_detection

  frontend:
    build: ./frontend

    ports:
      - "8081:3000"

    depends_on:
      - backend

volumes:
  postgres_data: